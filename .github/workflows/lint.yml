name: lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: syntax check
        run: |
          python -c "import ast; ast.parse(open('agent.py').read()); print('agent.py ok')"
          python -c "import ast; ast.parse(open('reporter.py').read()); print('reporter.py ok')"
      - name: bash lint
        run: bash -n bootstrap.sh && echo "bootstrap.sh ok"